<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="squareClip">
      <rect x="1" y="1" width="62" height="62" rx="14"/>
    </clipPath>
  </defs>

  <!-- cream-100 rounded square body -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#f7ecd2" stroke="#5a3a1e" stroke-width="2"/>

  <!-- cream-50 top highlight band -->
  <rect x="1" y="3" width="62" height="13" fill="#fff8e7" opacity="0.55" clip-path="url(#squareClip)"/>

  <!-- pickaxe handle: cocoa outline + caramel fill -->
  <line x1="18" y1="54" x2="38" y2="19" stroke="#5a3a1e" stroke-width="13" stroke-linecap="round"/>
  <line x1="18" y1="54" x2="38" y2="19" stroke="#c8874a" stroke-width="9" stroke-linecap="round"/>

  <!-- pickaxe head: slate crescent with cocoa outline, sharp pointed tips -->
  <path d="M 15,28 Q 36,2 58,26 Q 36,18 15,28 Z"
        fill="#5c5470" stroke="#5a3a1e" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- sun-lt sparkle star near the head -->
  <path d="M 50,10 Q 51.6,13.4 55,15 Q 51.6,16.6 50,20 Q 48.4,16.6 45,15 Q 48.4,13.4 50,10 Z"
        fill="#fff0a6"/>
</svg>
