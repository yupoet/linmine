<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7ecd2" />
    <meta name="description" content="林脉——叩开矿土，追寻矿脉，赶在镐头耗尽之前脱身。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Lin Mine" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lin Mine" />
    <meta property="og:description" content="Tap, dig and chain your way to the bottom of the shaft — a 3D mining adventure." />
    <meta property="og:url" content="https://linmine.yupoet.com/" />
    <meta property="og:image" content="https://linmine.yupoet.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://linmine.yupoet.com/icons/icon-512.png" />
    <title>林脉</title>
    <script>
      // Paint the saved skin before the first frame. Runs before any module,
      // so the two literals must track THEME_IDS in src/config/theme.ts.
      var savedTheme = null;
      try {
        savedTheme = localStorage.getItem('linmine.theme');
      } catch (err) {
        savedTheme = null;
      }
      document.documentElement.dataset.theme =
        savedTheme === 'candy' || savedTheme === 'ember' ? savedTheme : 'candy';
    </script>
    <style>
      /* Boot-critical styles live here so the first paint is correct before
         any module has loaded. Everything else comes from src/ui/styles.css. */
      /* Boot palette per skin. The ids must track THEME_IDS in
         src/config/theme.ts; #boot / #fatal / body read variables only. */
      html[data-theme='ember'] {
        color-scheme: dark;
        --boot-bg: #1b1410;
        --boot-glow: #3a2a1d;
        --boot-fg: #f6ece0;
        --boot-title: #ffcc66;
        --boot-title-shadow: #6b4310;
      }
      html[data-theme='candy'] {
        color-scheme: light;
        --boot-bg: #f7ecd2;
        --boot-glow: #fff8e7;
        --boot-fg: #3d2612;
        --boot-title: #fff8e7;
        --boot-title-shadow: #5a3a1e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--boot-bg);
        color: var(--boot-fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        /* The game is a single-finger tap game: suppress browser gestures. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui {
        position: absolute;
        inset: 0;
        /* The UI is a pass-through layer; individual controls opt back in. */
        pointer-events: none;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        background: radial-gradient(circle at 50% 18%, var(--boot-glow) 0%, var(--boot-bg) 70%);
        z-index: 10;
        transition: opacity 220ms ease;
      }
      #boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        margin: 0;
        font-size: clamp(2rem, 9vw, 3.5rem);
        letter-spacing: 0.06em;
        color: var(--boot-title);
        text-shadow: 0 3px 0 var(--boot-title-shadow);
      }
      #boot p {
        margin: 0;
        opacity: 0.7;
        font-size: 0.95rem;
      }
      #fatal {
        position: absolute;
        inset: 0;
        display: none;
        place-content: center;
        padding: 2rem;
        text-align: center;
        background: var(--boot-bg);
        z-index: 20;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      #fatal code {
        display: block;
        margin-top: 1rem;
        opacity: 0.6;
        font-size: 0.8rem;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <div id="boot">
        <h1>林脉</h1>
        <p>正在开凿矿道…</p>
      </div>
      <div id="fatal">
        <div>
          <strong>林脉无法启动。</strong>
          <code id="fatal-detail"></code>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
